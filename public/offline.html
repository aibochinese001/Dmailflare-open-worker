<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>离线 - Mailflare</title>
<style>
	body {
		margin: 0;
		min-height: 100dvh;
		display: flex;
		align-items: center;
		justify-content: center;
		font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
		background: #f6f8fc;
		color: #171717;
	}
	.card {
		text-align: center;
		padding: 3rem 2rem;
		background: #fff;
		border-radius: 1.5rem;
		box-shadow: 0 24px 70px -45px rgba(30, 64, 175, 0.55);
		max-width: 22rem;
	}
	h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.5rem; }
	p { font-size: 0.875rem; color: #525252; margin: 0 0 1.5rem; }
	button {
		border: 0;
		background: #2563eb;
		color: #fff;
		font-size: 0.875rem;
		font-weight: 500;
		padding: 0.625rem 1.5rem;
		border-radius: 9999px;
		cursor: pointer;
	}
</style>
</head>
<body>
	<div class="card">
		<h1>当前处于离线状态</h1>
		<p>无法连接到服务器，请检查网络连接后重试。/ You are offline. Please check your connection.</p>
		<button onclick="location.reload()">重新加载</button>
	</div>
</body>
</html>
